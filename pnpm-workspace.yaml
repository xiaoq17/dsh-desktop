packages:
  - plugins/*

# Mirrors the dsk-poc / shipped dsh profile layout: hoisted keeps every
# @deepseek-ai/* package resolvable at the top level, exactly like the
# profiles in $DSH_HOME/profiles/<name> use (nodeLinker: hoisted).
nodeLinker: hoisted
autoInstallPeers: false
minimumReleaseAgeExclude:
  - '@deepseek-ai/dsh-credentials@0.1.0-rc.8'
  - '@deepseek-ai/dsh-launch-environment@0.1.0-rc.8'
  - '@deepseek-ai/dsh-llm@0.1.0-rc.8'
  - '@deepseek-ai/dsh-timeout@0.1.0-rc.8'
  - '@deepseek-ai/dsh-web@0.1.0-rc.8'
allowBuilds:
  # esbuild ships a native binary postinstall (vite/vitest/tsx depend on it);
  # build it so the vitest toolchain runs (mirrors dsk-poc).
  esbuild: true
